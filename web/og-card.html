<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=JetBrains+Mono:wght@500&family=Schibsted+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        font-family: "Schibsted Grotesk", sans-serif;
        color: #eceae1;
        background:
          radial-gradient(60rem 40rem at 85% -10%, rgba(138,160,255,0.16), transparent 60%),
          radial-gradient(40rem 40rem at -5% 110%, rgba(203,169,106,0.08), transparent 60%),
          linear-gradient(160deg, #0b1019 0%, #0a0e16 55%, #080b12 100%);
        position: relative;
      }
      .grid {
        position: absolute; inset: 0;
        background-image: linear-gradient(rgba(180,195,230,0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(180,195,230,0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        -webkit-mask-image: radial-gradient(120% 90% at 50% 10%, black, transparent 78%);
      }
      .wrap { position: relative; padding: 70px 76px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
      .top { display: flex; align-items: center; gap: 16px; }
      .mono { width: 56px; height: 56px; border: 1px solid rgba(180,195,230,0.22); border-radius: 13px; display: flex; align-items: center; justify-content: center; font-family: "Fraunces", serif; font-size: 28px; font-weight: 600; background: rgba(255,255,255,0.02); }
      .mono b { color: #8aa0ff; font-weight: 600; }
      .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 15px; letter-spacing: 5px; text-transform: uppercase; color: #6b7385; }
      h1 { font-family: "Fraunces", serif; font-weight: 500; font-size: 92px; line-height: 0.98; letter-spacing: -1.5px; }
      .title { font-family: "Fraunces", serif; font-weight: 400; font-size: 40px; line-height: 1.1; color: rgba(236,234,225,0.82); margin-top: 14px; }
      .title .amp { color: #cba96a; }
      .stats { display: flex; gap: 54px; border-top: 1px solid rgba(180,195,230,0.12); padding-top: 26px; }
      .stat .n { font-family: "Fraunces", serif; font-size: 40px; font-weight: 500; color: #8aa0ff; }
      .stat .l { font-size: 15px; color: #a2aab9; margin-top: 3px; }
      .foot { display: flex; align-items: center; gap: 12px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #8aa0ff; box-shadow: 0 0 12px 2px rgba(138,160,255,0.6); }
      .foot span { font-family: "JetBrains Mono", monospace; font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: #6b7385; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="wrap">
      <div class="top">
        <div class="mono">S<b>K</b></div>
        <div class="eyebrow">Interactive Executive Profile</div>
      </div>
      <div>
        <h1>Shay Kopilevich</h1>
        <div class="title">Global IT Operations <span class="amp">&amp;</span> AI Transformation Leader</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="n">11,000</div><div class="l">Employees supported</div></div>
        <div class="stat"><div class="n">67</div><div class="l">Global IT team led</div></div>
        <div class="stat"><div class="n">8</div><div class="l">M&amp;A integrations</div></div>
        <div class="stat"><div class="n">35%</div><div class="l">Service Desk cut by AI</div></div>
      </div>
      <div class="foot"><span class="dot"></span><span>Grounded in verified experience</span></div>
    </div>
  </body>
</html>
